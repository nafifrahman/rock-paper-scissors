<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Lizard Spock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="game-container">
        <h1>Rock Paper Scissors Lizard Spock</h1>
        <div class="choices">
            <button class="choice" data-choice="rock">✊</button>
            <button class="choice" data-choice="paper">✋</button>
            <button class="choice" data-choice="scissors">✌️</button>
            <button class="choice" data-choice="lizard">🦎</button>
            <button class="choice" data-choice="spock">🖖</button>
        </div>
        <div id="result"></div>
        <div class="scoreboard">
            <span class="label">You</span>
            <span id="score">{{ user_score }} : {{ computer_score }}</span>
            <span class="label">Computer</span>
        </div>
        <div id="favourite">
            {% if favourite %}Your favourite: {{ favourite }}{% endif %}
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
